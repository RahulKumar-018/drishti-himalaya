<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Drishti-Himalaya — atmospheric road intelligence for Himalayan corridors." />
    <title>Drishti-Himalaya / Road Intelligence</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('drishti-theme');
          var isBright = saved === 'bright' || saved === 'light';
          var theme = isBright ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
