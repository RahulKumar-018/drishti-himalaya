services:
  - type: web
    name: drishti-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_MODE
        value: LIVE
      - key: CORS_ORIGINS
        value: "https://drishti-frontend.onrender.com"
      - key: DATABASE_ENABLED
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

  - type: web
    name: drishti-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://drishti-backend.onrender.com/api/v1"
      - key: NODE_VERSION
        value: "20"
